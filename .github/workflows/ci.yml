
name: CI - Qualidade e Testes

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff - Análise estática
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Configurar Python
        run: uv python install 3.12

      - name: Instalar dependências
        run: uv sync --frozen --python 3.12

      - name: Executar Ruff
        run: uv run --frozen ruff check .

  tests:
    name: Pytest - Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Configurar Python
        run: uv python install 3.12

      - name: Instalar dependências
        run: uv sync --frozen --python 3.12

      - name: Executar testes
        run: uv run --frozen pytest


  docker-build:
    name: Docker - Build da imagem
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Configurar Python
        run: uv python install 3.12

      - name: Instalar dependências
        run: uv sync --frozen --python 3.12

      - name: Gerar artefatos do modelo
        run: uv run --frozen python -m banking_intent_classifier.final_training

      - name: Validar artefatos
        run: |
          test -s artifacts/baseline_pipeline.joblib
          test -s artifacts/label_mapping.json

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: banking-intent-classifier:ci

  validate-gitflow:
    name: GitFlow - Validar origem do PR
    runs-on: ubuntu-latest

    steps:
      - name: Verificar origem do Pull Request
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == "main" ]]; then
            if [[ "$HEAD_REF" != "dev" ]]; then
              echo "::error::PRs para main devem ter origem na branch dev."
              echo "Origem recebida: $HEAD_REF"
              exit 1
            fi
          fi

          echo "Política GitFlow validada com sucesso."