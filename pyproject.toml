description = "Classificador de intenções bancárias utilizando NLP e o dataset BANKING77."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "datasets",
    "pandas",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"