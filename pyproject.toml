[project]
name = "banking-intent-classifier"
version = "0.1.0"
description = "Classificador de intenções bancárias utilizando NLP e o dataset BANKING77."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "datasets",
    "fastapi>=0.143.3",
    "pandas",
    "prometheus-client>=0.26.0",
    "scikit-learn>=1.9.1",
    "summary>=0.2.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
onnx = [
    "onnxruntime>=1.23.2,<1.24",
    "skl2onnx>=1.20.0",
]

[tool.uv]
# Garante wheels também para macOS Intel (onnxruntime recente não as publica).
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
