[project]
name = "banking-intent-classifier"
version = "0.1.0"
description = "Classificador de intenções bancárias utilizando NLP e o dataset BANKING77."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "datasets",
    "pandas",
    "summary>=0.2.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
