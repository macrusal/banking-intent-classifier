apiVersion: 1

datasources:
  - name: Prometheus
    # uid fixo: o dashboard referencia exatamente este valor.
    uid: banking-intent-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Igual ao scrape_interval, para o $__rate_interval sair correto.
      timeInterval: 5s
